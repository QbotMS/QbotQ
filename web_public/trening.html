<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script>try{if(localStorage.getItem("qtheme")==="dark")document.documentElement.classList.add("theme-dark")}catch(e){}</script>
<script src="/qdate.js?v=1"></script>
<link rel="stylesheet" href="/ui2.css?v=10">
<link rel="stylesheet" href="/nav.css?v=8">

<title>QBot — Trening</title>
<!-- TRENING (2026-10-08): jedna strona zamiast Kalendarza i Trenera.
     Zakladki rysuje trener.js (komputer) / trener-m.js (telefon, iPad): Kalendarz | Czas | Cele | Sezon (Dostepnosc i Ustawienia -> SETUP > Trening od 2026-10-08).
     Kalendarz = sekcja #p-kal + kalendarz3.js (miesiac z powiekszonym tygodniem + plan Trenera + panel dnia i edytory); style zawezone do #p-kal.
     Pozostale = dzialy trener.js w #p-trener. Przelaczanie: trener.js go() ustawia body.tr-month. /trener.html i /kalendarz.html przekierowuja tutaj.
     Dok.: docs/TRENER.md -->
<style>
#p-kal{display:none}
body.tr-month #p-kal{display:block}
body.tr-month #tr-body{display:none}
#p-kal .ctop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
#p-kal .cnav{display:flex;align-items:center;gap:8px}
#p-kal .cnav button,#p-kal .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r-sm);height:36px;min-width:36px;font:inherit;font-size:18px;cursor:pointer;padding:0 10px}
#p-kal .cnav .lbl{font-size:21px;font-weight:700;min-width:190px;text-align:center}
#p-kal .cnav .today{font-size:14px}
#p-kal .cact{display:flex;gap:8px;align-items:center}
#p-kal .pill{border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;background:var(--accent-bg);color:var(--accent-ink)}
#p-kal .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-size:14px;font-weight:600}
#p-kal .btn.pri:disabled{opacity:.5;cursor:default}
#p-kal .msum{font-size:14px;color:var(--ink2)}#p-kal .msum b{color:var(--ink)}
#p-kal .tiles{display:grid;grid-template-columns:repeat(4,minmax(112px,150px)) minmax(0,1fr);gap:8px;margin-bottom:10px;align-items:stretch}
#p-kal .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#p-kal .tile .l{font-size:12px;color:var(--ink2)}#p-kal .tile .v{font-size:18px;font-weight:700;margin-top:1px;line-height:1.2;white-space:nowrap}
#p-kal .tile .v small{font-size:13px;font-weight:600}
#p-kal .tile.al{border-left:4px solid var(--warn);background:var(--warn-bg);font-size:13px;line-height:1.4;display:flex;flex-direction:column;justify-content:center;gap:3px}
#p-kal .tile.al.ok{border-left-color:var(--good);background:var(--card);color:var(--ink2)}
#p-kal .tile.al ul{margin:3px 0 3px 18px;padding:0}
#p-kal .tile.al button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer}
#p-kal .tile.al .acts{margin-top:3px;display:flex;gap:6px}#p-kal .tile.al #k3-ok{background:var(--accent);border-color:var(--accent);color:#fff}
#p-kal details.more{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:0 0 12px}
#p-kal details.more>summary{cursor:pointer;list-style:none;padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between}
#p-kal details.more>summary::-webkit-details-marker{display:none}
#p-kal details.more>summary::after{content:"▸";color:var(--muted)}#p-kal details.more[open]>summary::after{content:"▾"}
#p-kal details.more .in{padding:0 14px 14px;border-top:1px dashed var(--line)}
#p-kal .bar{height:12px;border-radius:6px;background:var(--well);position:relative;overflow:hidden;margin:12px 0 6px}
#p-kal .bar i{position:absolute;top:0;bottom:0;left:0}
#p-kal .sub{font-size:13px;color:var(--muted)}
#p-kal .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
#p-kal .box b{font-size:15px}#p-kal .box ul{margin:4px 0 8px 18px;padding:0}
#p-kal .box textarea{display:block;width:100%;margin:8px 0;min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--well);color:var(--ink);font:inherit;font-size:14px;padding:8px}
#p-kal .box button{font:inherit;font-size:13.5px;border-radius:8px;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin-top:6px}
#p-kal .box button.pri{border-color:var(--accent);background:var(--accent);color:#fff}#p-kal .box button:disabled{opacity:.55;cursor:default}
#p-kal .iss{border-left:3px solid var(--warn);padding:4px 8px;margin:6px 0}
#p-kal .lay{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
#p-kal .mhd{display:grid;grid-template-columns:92px repeat(7,minmax(0,1fr));gap:4px;font-size:13px;color:var(--muted);margin-bottom:4px}
#p-kal .mhd span{padding-left:6px}
#p-kal .wrow{display:grid;grid-template-columns:92px repeat(7,minmax(0,1fr));gap:4px;margin-bottom:4px}
#p-kal .wlab{font-size:12px;color:var(--muted);padding:6px 4px;line-height:1.45;cursor:pointer;border-radius:6px;border:1px dashed var(--line)}
#p-kal .wlab b{display:block;color:var(--ink2);font-size:13px}
#p-kal .wrow.big .wlab{color:var(--accent-ink);background:var(--accent-bg);border-color:var(--accent)}#p-kal .wrow.big .wlab b{color:var(--accent-ink)}
#p-kal .cd,#p-kal .bd{background:var(--card);border:1px solid var(--line);border-radius:7px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
#p-kal .cd:hover,#p-kal .bd:hover{border-color:var(--line2)}
#p-kal .cd{padding:6px 7px;min-height:104px;gap:2px;font-size:12.5px}
#p-kal .bd{padding:7px 8px;min-height:200px;gap:4px;font-size:13px}
#p-kal .cd.off,#p-kal .bd.off{opacity:.38}#p-kal .cd.t,#p-kal .bd.t{border:2px solid var(--accent)}#p-kal .cd.ill,#p-kal .bd.ill{background:var(--bad-bg)}
#p-kal .cd.sel,#p-kal .bd.sel{outline:2px solid var(--accent);outline-offset:-2px}
#p-kal .n{display:flex;justify-content:space-between;align-items:baseline;gap:4px}#p-kal .n b{font-size:14px;color:var(--ink2);font-weight:600}#p-kal .bd .n b{font-size:16px;color:var(--ink)}
#p-kal .n .r{font-size:11.5px;font-weight:600;white-space:nowrap}
#p-kal .wx{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#p-kal .wx.bad{color:var(--bad);font-weight:700}
#p-kal .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
#p-kal .ln.done{color:var(--accent-ink);font-weight:600}#p-kal .ln.p{border:1px dashed var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 4px}
#p-kal .ln.sk{opacity:.5;text-decoration:line-through}
#p-kal .ln.ok{color:var(--good);font-weight:700}#p-kal .ln.miss{color:var(--bad);opacity:.85}
#p-kal .ss.done{background:var(--good-bg);border-color:var(--good);border-left-color:var(--good)}#p-kal .ss.done b{color:var(--good)}
#p-kal .ss.miss{border-left-color:var(--bad);opacity:.8}#p-kal .ss.miss b{color:var(--bad)}
#p-kal .ss.plan{border-style:dashed;border-left-style:solid}
#p-kal .dp .row.st-done .s{color:var(--good);font-weight:600}#p-kal .dp .row.st-miss .s{color:var(--bad)}
#p-kal .dots i.m{background:var(--bad);opacity:.7}
#p-kal .ln.ev{background:#dbe9f7;color:#0c447c;border-radius:4px;padding:0 4px}#p-kal .ln.ev-jazda,#p-kal .ln.ev-urlop{background:#cfe9d6;color:#1c5030}#p-kal .ln.ev-delegacja{background:#e6e4fb;color:#3c3489}
#p-kal .ln.ill{background:#f7c1c1;color:#501313;border-radius:4px;padding:0 4px}#p-kal .ln.gray{background:var(--well);color:var(--ink2);border-radius:4px;padding:0 4px}
html.theme-dark #p-kal .ln.ev{background:#0c447c;color:#b5d4f4}html.theme-dark #p-kal .ln.ev-jazda,html.theme-dark #p-kal .ln.ev-urlop{background:#1c5030;color:#bfe6c9}html.theme-dark #p-kal .ln.ev-delegacja{background:#3c3489;color:#cecbf6}html.theme-dark #p-kal .ln.ill{background:#791f1f;color:#f7c1c1}
#p-kal [data-eid],#p-kal [data-sid]{cursor:pointer}
#p-kal .ss{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:4px 7px;line-height:1.35;background:var(--well)}
#p-kal .ss:hover{border-color:var(--accent)}
#p-kal .ss small{display:block;color:var(--ink2);font-size:12px}#p-kal .ss small.kal{color:#3f6f9a;text-decoration:underline dotted}html.theme-dark #p-kal .ss small.kal{color:#b5d4f4}#p-kal .ss.skip{opacity:.5}#p-kal .ss.skip b{text-decoration:line-through}
#p-kal .ty{font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-bg);border-radius:999px;padding:1px 8px;align-self:flex-start}
#p-kal .sl{margin-top:auto;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:4px;padding-top:2px}
#p-kal .free,#p-kal .empty{font-size:12.5px;color:var(--muted)}
#p-kal .leg{margin-top:10px;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
#p-kal .dots{display:none;gap:3px;flex-wrap:wrap;margin-top:auto}
#p-kal .dots i{width:8px;height:8px;border-radius:50%;display:block}
#p-kal .dots i.d{background:var(--accent)}#p-kal .dots i.p{border:1.5px dashed var(--accent)}#p-kal .dots i.e{background:#3f6f9a}#p-kal .dots i.x{background:var(--bad)}
#p-kal .dp{position:sticky;top:14px}
#p-kal .lay.nodp{grid-template-columns:minmax(0,1fr)}#p-kal .lay.nodp .dp{display:none}
#p-kal .dp .dph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#p-kal .dp .dpx{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);width:30px;height:30px;border-radius:8px;font-size:14px;cursor:pointer;flex:0 0 auto}
#p-kal .dp h3{margin:0;font-size:18px;font-weight:600}
#p-kal .dp .kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:14px;line-height:1.6;margin-top:4px}
#p-kal .dp .grp{margin-top:12px}#p-kal .dp .grp .sh{font-size:12.5px;color:var(--muted);margin-bottom:2px}
#p-kal .dp .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line)}
#p-kal .dp .row:last-child{border-bottom:0}#p-kal .dp .row .s{color:var(--ink2);text-align:right;white-space:nowrap}
#p-kal .dp .row.click:hover{color:var(--accent-ink)}
#p-kal .dp .empty{font-size:13.5px;padding:4px 0}
#p-kal .dp .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
#p-kal .dp .acts button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r-sm);padding:9px 4px;font:inherit;font-size:13.5px;cursor:pointer}
#p-kal .dp .acts button:hover{border-color:var(--accent)}
@media(max-width:1300px){#p-kal .lay{grid-template-columns:1fr}#p-kal .dp{position:static}}
@media(max-width:1100px){#p-kal .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}#p-kal .tile.al{grid-column:1/-1}}
@media(max-width:760px){
  #p-kal .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  #p-kal .mhd{display:none}
  #p-kal .wrow{grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
  #p-kal .wlab{grid-column:1/-1;padding:4px 6px}#p-kal .wlab b{display:inline;margin-right:6px}#p-kal .wlab br{display:none}
  #p-kal .cd{min-height:60px;padding:3px}#p-kal .cd .ln,#p-kal .cd .sl,#p-kal .cd .wx,#p-kal .cd .n .r{display:none}
  #p-kal .cd .dots{display:flex}
  #p-kal .wrow.big{grid-template-columns:1fr}#p-kal .bd{min-height:0}
  #p-kal .cnav .lbl{font-size:17px;min-width:0}
}
/* okna: edytor wpisu, trening, dodaj trening, ustaw dzien */
#p-kal .km-scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:1250}
#p-kal .km-scrim.on{opacity:1;pointer-events:auto}
#p-kal .km{position:fixed;z-index:1251;background:var(--card);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);width:min(480px,94vw);max-height:88vh;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;overflow:hidden}
#p-kal .km.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#p-kal .km-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
#p-kal .km-head .kt{font-size:16px;font-weight:600;flex:1}
#p-kal .km-x{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);width:32px;height:32px;border-radius:9px;font-size:15px;cursor:pointer;flex:0 0 auto}
#p-kal .km-body{padding:14px 16px 4px;overflow:auto;font-size:14px}
#p-kal .km-types{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#p-kal .km-types button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
#p-kal .km-types button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-ink)}
#p-kal .km-types button[disabled]{opacity:.32;cursor:default}
#p-kal .km label{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin:10px 0 4px}
#p-kal .km input[type=text],#p-kal .km input[type=date],#p-kal .km input[type=time],#p-kal .km textarea,#p-kal .km select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--well);color:var(--ink);font:inherit;font-size:14px}
#p-kal .km textarea{min-height:54px;resize:vertical}
#p-kal .km .row2{display:flex;gap:10px}#p-kal .km .row2>div{flex:1;min-width:0}
#p-kal .km-sw{display:flex;gap:8px;flex-wrap:wrap}
#p-kal .km-sw button{width:28px;height:28px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
#p-kal .km-sw button.on{border-color:var(--ink)}
#p-kal .km-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
#p-kal .km-foot button{flex:1;padding:11px;border-radius:11px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#p-kal .km-foot .save{border-color:var(--accent);background:var(--accent);color:#fff}
#p-kal .km-foot .del{flex:0 0 auto;border-color:var(--bad);color:var(--bad);background:transparent}
#p-kal .km-sec{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
#p-kal .km-sec .sh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
#p-kal .km-err{color:var(--bad);font-size:12.5px;min-height:14px;margin-top:6px}
#p-kal .km-cur{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
#p-kal .km-mailst{font-size:12px;font-weight:600}
#p-kal .km .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 4px}
#p-kal .km .g2 button{padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
#p-kal .km .g2 button.bad{color:var(--bad)}
#p-kal .km .det{white-space:pre-line;line-height:1.5;background:var(--well);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
#p-kal .km .list{display:flex;flex-direction:column;margin-top:6px}
#p-kal .km .li{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
#p-kal .km .li .ic{font-size:22px;width:30px;text-align:center}#p-kal .km .li small{display:block;font-size:12.5px;color:var(--muted)}
#p-kal .km .li:hover{color:var(--accent-ink)}
@media(max-width:600px){#p-kal .km{left:0;right:0;bottom:0;top:auto;transform:translateY(100%);width:auto;max-height:92vh;border-radius:18px 18px 0 0}#p-kal .km.on{transform:translateY(0)}}
#k3-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:1300;background:var(--card);border:1px solid var(--good);color:var(--good);border-radius:12px;padding:10px 16px;font-size:14.5px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:92vw}
#k3-toast.bad{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body><div class="wrap">

<div class="head">
  <h1>Trening</h1>
  <span class="mock"></span> <button class="themebtn" id="themebtn" type="button" aria-label="Tryb dzienny / nocny"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div>

<!-- dzialy Trenera (trener.js / trener-m.js). Style trener.css sa pod #p-trener. -->
<section class="panel stack" id="p-trener">
<div id="trener-root"></div>
</section>

<!-- KALENDARZ (kalendarz3.js) -->
<section id="p-kal">
<div class="ctop">
  <div class="cnav"><button type="button" id="k3-bp" aria-label="Poprzedni miesiąc">‹</button><span class="lbl" id="k3-lbl">…</span><button type="button" id="k3-bn" aria-label="Następny miesiąc">›</button><button type="button" class="today" id="k3-bt">dziś</button></div>
  <div class="msum" id="k3-msum"></div>
  <div class="cact"><span class="pill" id="k3-phase"></span><button type="button" class="btn pri" id="k3-gen">↻ przelicz tydzień</button></div>
</div>
<div class="tiles" id="k3-tiles"></div>
<details class="more"><summary id="k3-moresum">Szczegóły tygodnia</summary><div class="in" id="k3-morein"></div></details>
<div class="lay nodp" id="k3-lay">
<div>
  <div class="mhd"><span></span><span>pon</span><span>wt</span><span>śr</span><span>czw</span><span>pt</span><span>sob</span><span>nd</span></div>
  <div id="k3-grid">ładuję…</div>
  <div class="leg"><span><b style="color:var(--good)">✓ zielone</b> = plan zrobiony</span><span><b style="color:var(--bad)">✗</b> = plan niezrobiony</span><span class="ln p" style="display:inline">kreskowane</span><span>= plan</span><span><b style="color:var(--accent-ink)">pomarańcz</b> = poza planem (km · czas · XSS)</span><span class="ln ev" style="display:inline">niebieskie</span><span>= wydarzenie</span><span>prawy róg = gotowość · dół = sen · waga · kliknij dzień, trening lub wpis</span></div>
</div>
<div class="card dp" id="k3-dp"></div>
</div>
<div class="km-scrim" id="km-scrim"></div>
<div class="km" id="km" role="dialog" aria-modal="true"></div>
</section>

</div>
