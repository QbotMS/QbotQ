<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script>try{if(localStorage.getItem("qtheme")==="dark")document.documentElement.classList.add("theme-dark")}catch(e){}</script>
<link rel="stylesheet" href="/ui2.css?v=11">
<title>QBot — Status funkcji</title>
<!-- STATUS (2026-10-15): SETUP > Polaczenia > Status (ramka w setup.html). Dane: GET /api/setup/status
     (qbot_status_api.py -> qbot_status_checks.all_checks; to samo zrodlo co narzedzia Alberta). Paleta: UI2. Dok.: docs/STATUS.md -->
<style>
body{background:transparent}
.sx{max-width:820px}
.sx-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.sx-sum{font-size:16px;font-weight:600;color:var(--ink)}
.sx-sum.ok{color:var(--good)}.sx-sum.warn{color:var(--warn)}.sx-sum.bad{color:var(--bad)}
.sx-at{font-size:13px;color:var(--muted)}
.sx-btn{margin-left:auto;appearance:none;border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:var(--r-sm);padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.sx-btn:hover{border-color:var(--accent)}.sx-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.sx-btn:disabled{opacity:.5;cursor:default}
.sx-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.sx-row{display:grid;grid-template-columns:200px 1fr;gap:4px 16px;padding:12px 16px;border-top:1px solid var(--line);align-items:baseline}
.sx-row:first-child{border-top:0}
.sx-name{font-weight:600;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
.sx-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--muted)}
.sx-row.ok .sx-dot{background:var(--good)}.sx-row.warn .sx-dot{background:var(--amber)}.sx-row.bad .sx-dot{background:var(--bad)}
.sx-row.off .sx-dot{background:transparent;border:2px solid var(--muted);width:6px;height:6px}
.sx-txt{font-size:14px;color:var(--ink2);line-height:1.45}
.sx-row.bad{background:var(--bad-bg)}.sx-row.bad .sx-txt{color:var(--ink)}
.sx-row.warn{background:var(--warn-bg)}.sx-row.warn .sx-txt{color:var(--ink)}
.sx-row.off .sx-name{color:var(--muted)}
.sx-note{font-size:13px;color:var(--muted);margin:10px 2px 0;line-height:1.45}
.sx-err{padding:14px 16px;color:var(--bad)}
@media (max-width:560px){.sx-row{grid-template-columns:1fr}.sx-txt{padding-left:18px}}
</style>
</head>
<body>
<div class="sx">
  <div class="sx-top">
    <span class="sx-sum" id="sx-sum">sprawdzam…</span>
    <span class="sx-at" id="sx-at"></span>
    <button type="button" class="sx-btn" id="sx-btn">Sprawdź ponownie</button>
  </div>
  <ul class="sx-list" id="sx-list"></ul>
  <p class="sx-note">Zielony — działa. Żółty — działa, ale coś wymaga uwagi. Czerwony — nie działa. Pusta kropka — świadomie wyłączone.
    Ten sam stan zna Albert: zapytaj go „czy wszystko działa?”.</p>
</div>
<script>
(function(){
"use strict";
var LBL={ok:"Wszystko działa.",warn:"Coś wymaga uwagi.",bad:"Coś nie działa."};
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function load(){
  var b=$("sx-btn");b.disabled=true;$("sx-sum").className="sx-sum";$("sx-sum").textContent="sprawdzam…";
  fetch("/api/setup/status",{credentials:"same-origin",cache:"no-store"})
    .then(function(r){if(r.status===403)throw new Error("Status widzi tylko właściciel.");if(!r.ok)throw new Error("Serwer odpowiedział błędem "+r.status+".");return r.json();})
    .then(function(j){
      $("sx-sum").className="sx-sum "+j.overall;$("sx-sum").textContent=j.summary||LBL[j.overall]||"";
      $("sx-at").textContent="sprawdzone "+(j.checked_at_txt||"");
      $("sx-list").innerHTML=(j.items||[]).map(function(i){
        return '<li class="sx-row '+esc(i.state)+'"><span class="sx-name"><span class="sx-dot" aria-hidden="true"></span>'+esc(i.name)+
          '</span><span class="sx-txt">'+esc(i.text)+'</span></li>';}).join("");
    })
    .catch(function(e){$("sx-sum").className="sx-sum bad";$("sx-sum").textContent="Nie udało się sprawdzić stanu.";
      $("sx-list").innerHTML='<li class="sx-err">'+esc(e.message)+' Spróbuj ponownie za chwilę.</li>';})
    .then(function(){b.disabled=false;});
}
$("sx-btn").addEventListener("click",load);
load();
})();
</script>
</body>
</html>
