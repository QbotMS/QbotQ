<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">W′bal minimalny i końcowy w dwóch zapisanych jazdach QExt2</title>
  <desc id="desc">Wartości procentowe z podsumowań QBota: 16 października 2026 minimum 40, koniec 83; 18 października 2026 minimum 59, koniec 89.</desc>
  <rect width="720" height="390" fill="#fffaf2"/>
  <text x="32" y="38" font-family="sans-serif" font-size="20" font-weight="700" fill="#26332f">Rezerwa zapisana po jeździe</text>
  <text x="32" y="64" font-family="sans-serif" font-size="13" fill="#56635d">W′bal w procentach, dwa przykłady z historii QBota</text>
  <g stroke="#d9d4ca" stroke-width="1">
    <line x1="90" y1="300" x2="665" y2="300"/><line x1="90" y1="250" x2="665" y2="250"/>
    <line x1="90" y1="200" x2="665" y2="200"/><line x1="90" y1="150" x2="665" y2="150"/>
    <line x1="90" y1="100" x2="665" y2="100"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#56635d" text-anchor="end">
    <text x="78" y="304">0</text><text x="78" y="254">25</text><text x="78" y="204">50</text>
    <text x="78" y="154">75</text><text x="78" y="104">100</text>
  </g>
  <g fill="#f47b2b"><rect x="170" y="220" width="55" height="80" rx="4"/><rect x="405" y="182" width="55" height="118" rx="4"/></g>
  <g fill="#f6bc83"><rect x="245" y="134" width="55" height="166" rx="4"/><rect x="480" y="122" width="55" height="178" rx="4"/></g>
  <g font-family="sans-serif" font-size="14" font-weight="700" fill="#26332f" text-anchor="middle">
    <text x="197" y="212">40%</text><text x="272" y="126">83%</text><text x="432" y="174">59%</text><text x="507" y="114">89%</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#26332f" text-anchor="middle">
    <text x="235" y="328">16.10.2026</text><text x="470" y="328">18.10.2026</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#56635d">
    <rect x="190" y="352" width="12" height="12" rx="2" fill="#f47b2b"/><text x="209" y="363">minimum</text>
    <rect x="302" y="352" width="12" height="12" rx="2" fill="#f6bc83"/><text x="321" y="363">wartość końcowa</text>
  </g>
</svg>
