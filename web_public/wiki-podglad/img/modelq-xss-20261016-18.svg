<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Składowe XSS z dwóch jazd</title><desc id="desc">Rzeczywiste wyniki ModelQ z 16 i 18 października 2026. Każda składowa ma własną skalę.</desc><rect width="760" height="360" fill="#fbf7ed"/><text x="28" y="30" font-family="sans-serif" font-size="18" fill="#19302a">XSS z dwóch jazd — 16 i 18.10.2026</text><text x="28" y="52" font-family="sans-serif" font-size="12" fill="#806f54">Długości porównywalne tylko w obrębie tej samej składowej.</text><g font-family="sans-serif" font-size="13" fill="#26342e"><text x="35" y="115">16.10</text><text x="35" y="220">18.10</text><text x="120" y="78">Low</text><text x="320" y="78">High</text><text x="520" y="78">Peak</text></g><g fill="#3478c8"><rect x="115" y="91" width="75" height="28" rx="4"/><rect x="115" y="196" width="180" height="28" rx="4"/></g><g fill="#8e78d8"><rect x="315" y="91" width="180" height="28" rx="4"/><rect x="315" y="196" width="153" height="28" rx="4"/></g><g fill="#e87b2b"><rect x="515" y="91" width="180" height="28" rx="4"/><rect x="515" y="196" width="94" height="28" rx="4"/></g><g fill="#8e78d8"><rect x="315" y="91" width="260" height="28" rx="4"/><rect x="315" y="196" width="220" height="28" rx="4"/></g><g fill="#e87b2b"><rect x="515" y="91" width="260" height="28" rx="4"/><rect x="515" y="196" width="136" height="28" rx="4"/></g><g font-family="sans-serif" font-size="12" fill="#26342e"><text x="230" y="110">63,6</text><text x="380" y="215">152,6</text><text x="580" y="110">5,85</text><text x="540" y="215">4,96</text><text x="660" y="110">0,329</text><text x="660" y="215">0,172</text></g><text x="28" y="310" font-family="sans-serif" font-size="11" fill="#806f54">Suma: 16.10.2026 = 69,7 XSS; 18.10.2026 = 157,7 XSS. Długości w osobnych skalach nie porównuj między kolorami.</text><text x="28" y="335" font-family="sans-serif" font-size="11" fill="#806f54">Źródło: qbot_v2.modelq2_ride, odczyt 18.10.2026</text></svg>