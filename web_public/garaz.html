<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1"><link rel="alternate icon" href="/favicon.ico?v=1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/ui2.css?v=9">
<link rel="stylesheet" href="/nav.css?v=4">
<script>try{if(localStorage.getItem("qtheme")==="dark")document.documentElement.classList.add("theme-dark")}catch(e){}</script>
<title>Garaż — QBot lab</title>
<style>
html{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;height:100%;overflow:hidden;display:flex;flex-direction:column}
.head{padding:22px 32px 8px;margin:0;align-items:center}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow a{color:var(--muted);text-decoration:none}
.sub{color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 32px 8px}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14.5px}
.toolbar #gsearch{flex:1 1 200px;min-width:150px}
.count{font-size:13px;color:var(--muted);margin-left:2px}
.btn{padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;font-size:14px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sec.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.wrap{flex:1 1 auto;min-height:0;overflow-y:auto;max-width:none;margin:0;padding:0 32px 32px}
table.gt{width:100%;border-collapse:collapse;font-size:15px}
.gt thead th{position:sticky;top:0;z-index:1;background:var(--panel);text-align:left;font-size:13.5px;font-weight:700;color:var(--ink2);padding:9px 11px;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line);user-select:none}
.gt thead th.num{text-align:right}
.gt thead th.noclick{cursor:default}
.gt thead th .ar{color:var(--accent);font-size:11px;margin-left:3px}
.gt tbody td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
.gt tbody td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.gt tbody td.mdl{font-weight:600}
.gt tbody tr:hover{background:var(--accent-bg)}
.gt tbody tr.arch{opacity:.45}
.gt .gact{display:flex;gap:6px}
.gt .gact button{padding:5px 10px;border-radius:7px;font-size:13px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;white-space:nowrap}
.gt .gact button.sec{background:var(--card);color:var(--ink2);border-color:var(--line)}
.sez{display:inline-flex;gap:3px}
.sez b{font-weight:700;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--panel);color:var(--muted)}
.sez b.on{background:var(--accent-bg);color:var(--accent)}
.stars{color:var(--warn);letter-spacing:1px;white-space:nowrap}
.fab{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel);color:var(--ink2);white-space:nowrap}
.fab.mer{background:var(--warn-bg);color:var(--warn)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--line);margin-right:6px;vertical-align:-1px}
.empty{font-size:15px;color:var(--muted);padding:30px 4px}
.modal-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1500}
body.modal-open .modal-back{display:block}
.modal{display:none;position:fixed;z-index:1501;top:50%;left:50%;transform:translate(-50%,-50%);width:1020px;max-width:96vw;max-height:92vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.modal.open{display:block}
.modal-head{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head .t{font-weight:800;font-size:16px;flex:1}
.modal-x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer}
.mbody{padding:16px 18px}
.mmeta{font-size:12.5px;color:var(--muted);margin-bottom:10px;padding:6px 9px;background:var(--panel);border-radius:8px}
.murl{display:flex;gap:8px;margin:2px 0 6px}
.murl input{flex:1 1 auto;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:14px}
.murlmsg{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;flex-direction:column;gap:3px}
.mf.full{grid-column:1 / -1}
.mf label{font-size:13px;color:var(--ink2)}
.mf input,.mf select,.mf textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:14.5px;font-family:inherit}
.mf textarea{min-height:70px;resize:vertical}
.mf input,.mf select{height:40px}
.segbar{display:flex;gap:6px}
.segbar button{flex:1 1 0;padding:7px 6px;border:1px solid var(--line);background:var(--paper);color:var(--ink2);border-radius:8px;font-size:13.5px;cursor:pointer}
.segbar button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.starpick{display:flex;gap:4px;align-items:center}
.starpick button{background:none;border:0;font-size:24px;line-height:1;color:var(--line);cursor:pointer;padding:0 1px}
.starpick button.on{color:var(--warn)}
.starpick .clr{font-size:12px;color:var(--muted);margin-left:6px;cursor:pointer;text-decoration:underline}
.mphoto{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.mthumb{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:var(--panel)}
.mphoto-ctrl{display:flex;flex-direction:column;gap:6px}
.filelbl{cursor:pointer}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1600;align-items:center;justify-content:center;cursor:zoom-out}
body.lb-open .lightbox{display:flex}
.lightbox img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.mfoot{display:flex;gap:8px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.mfoot .msg{flex:1;font-size:13px;color:var(--muted)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger.armed{background:#7d2f20;border-color:#7d2f20}
.sechead{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:16px 0 6px}
.svy-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1700}
body.svy-open .svy-back{display:block}
.svy{display:none;position:fixed;z-index:1701;top:50%;left:50%;transform:translate(-50%,-50%);
  width:680px;max-width:96vw;max-height:94vh;overflow-y:auto;background:var(--card);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
body.svy-open .svy{display:block}
.svy-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.svy-head .t{flex:1;font-weight:800;font-size:16px}
.svy-prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.svy-body{padding:14px 18px}
.svy-item{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.svy-item img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.svy-name{font-size:16px;font-weight:700;line-height:1.25}
.svy-sub{font-size:13px;color:var(--ink2);margin-top:2px}
.svy-note{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.svy-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.svy-row .lab{flex:0 0 168px;font-size:14px;color:var(--ink2)}
.svy-scale{display:flex;gap:5px;flex-wrap:wrap}
.svy-scale button{width:34px;height:32px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink2);border-radius:8px;font-size:14px;cursor:pointer}
.svy-scale button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.svy-scale button.nd{width:44px;font-size:12px}
.svy-row .lab{flex:0 0 230px}
.svy-q{font-size:14px;color:var(--ink)}
.svy-w{font-size:11.5px;color:var(--accent)}
.svy-h{font-size:11.5px;color:var(--muted);line-height:1.3}
/* Moja ocena usunieta z okna (2026-09-24) - Ocena liczona z Ankiety */
.mf:has(#mRating){display:none}
.svy-scale button.nd.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.svy-foot{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.svy-foot .msg{flex:1;font-size:12.5px;color:var(--muted)}
.badge-draft{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-weight:700}
.badge-ok{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--good-bg);color:var(--good);font-weight:700}
.tabbar{display:flex;flex:0 0 auto;gap:2px;margin:0 32px;border-bottom:1px solid var(--line);align-items:flex-end;overflow-x:auto;overflow-y:hidden}
.tabsearch{margin-left:auto;flex:0 1 360px;display:flex;padding:0 0 6px 12px;min-width:180px}
.tabsearch input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font-size:14.5px}
.tabbar button{appearance:none;background:none;border:0;font:inherit;font-size:16px;color:var(--ink2);padding:9px 14px;margin-bottom:-1px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabbar button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.view{display:none}
.view.on{display:block}
.bikecards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,240px);gap:10px;margin:10px 0 18px;overflow-x:auto;padding-bottom:4px}
@media (max-width:800px){.bikecards{grid-auto-columns:62%}}
.bikecard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;transition:border-color .15s,background .15s}
.bikecard .bkimg{position:relative;aspect-ratio:16/10;background:var(--panel);display:flex;align-items:center;justify-content:center}
.bikecard .bkimg img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.bikecard .bkph{font-size:32px;opacity:.35}
.bikecard .bkimg .bkedit{position:absolute;top:6px;right:6px}
.bikecard .bktxt{padding:7px 10px 9px}
.bikecard h3{margin:0 0 2px;font-size:14.5px;line-height:1.25}
.bikecard .bkfull{font-size:12px;color:var(--ink2);margin-bottom:2px}
.bikecard:hover{border-color:var(--accent)}
.bikecard.sel{border-color:var(--accent);background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.bikecard.inact{opacity:.6}
.bikecard .bkedit{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink2);cursor:pointer}
.bikecard .bkedit:hover{border-color:var(--accent);color:var(--ink)}
.bikecard .meta{font-size:12px;color:var(--ink2)}
.bikecard .note{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
.secttl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:18px 0 6px}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.pill.mount{background:var(--good-bg);color:var(--good)}
.pill.spare{background:var(--warn-bg);color:var(--warn)}
.pill.off{background:var(--panel);color:var(--muted)}
.qf-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.qf-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.qf-head h4{margin:0;font-size:16px}
.qf-act{display:flex;gap:6px;flex-wrap:wrap}
.qf-card .note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.qf-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
.qf-row b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.qf-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.qf-grid{grid-template-columns:1fr}}
.qf-item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.qf-item.sel{border-color:var(--accent);background:var(--accent-bg)}
.qf-it-m{font-size:12.5px;color:var(--ink2)}
.qf-badge{font-size:11.5px;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600}
.qf-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:14px}
.qf-ctl select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.qf-ctl label{display:flex;gap:6px;align-items:center;color:var(--ink2)}
.dimsgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dimsgrid span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:3px}
.qf-it-a{grid-row:1/4;grid-column:2;align-self:center;display:flex;gap:6px}
.qf-draw .qf-photo{grid-column:2;max-width:100%;max-height:320px;object-fit:contain;justify-self:start;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
@media (max-width:900px){.qf-draw .qf-photo{grid-column:1}}
.qf-item.wph{grid-template-columns:44px 1fr auto}
.qf-item.wph .qf-it-a{grid-column:3}
.qf-it-ph{grid-row:1/4;width:44px;height:54px;object-fit:cover;border-radius:6px;cursor:zoom-in}
.qf-phrow{display:flex;gap:12px;align-items:flex-start}
.qf-phprev{max-width:160px;max-height:200px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.qf-phctl{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.qf-phst{font-size:12.5px;color:var(--muted)}
.qf-mc .m{position:relative;cursor:help;outline:none}
.qf-mc .m .qf-i{font-size:11px;color:var(--muted)}
.qf-mc .m[data-tip]:hover::after,.qf-mc .m[data-tip]:focus::after{content:attr(data-tip);position:absolute;left:0;top:100%;z-index:30;width:280px;max-width:80vw;margin-top:6px;padding:9px 11px;background:var(--ink);color:var(--card);font-size:12.5px;font-weight:400;line-height:1.45;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.28);white-space:normal}
.qf-mc .m:nth-child(2n)[data-tip]:hover::after,.qf-mc .m:nth-child(2n)[data-tip]:focus::after{left:auto;right:0}
.qf-draw{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:16px;align-items:start}
.qf-draw .qf-mc{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:0}
@media (max-width:900px){.qf-draw{grid-template-columns:1fr}.qf-svg{max-width:520px}}
.qf-mc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:800px){.qf-mc{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qf-mc .m{background:var(--panel);border-radius:10px;padding:8px 10px}
.qf-mc .l{font-size:12px;color:var(--ink2)}
.qf-mc .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.qf-mc .d{font-size:12px;color:var(--muted)}
.qf-mc .d.ok{color:var(--good)} .qf-mc .d.warn{color:var(--warn)}
.qf-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:start}
.fitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.fitbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fitbox h4{margin:0 0 8px;font-size:14px;color:var(--accent)}
.fitrow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;border-bottom:1px solid var(--line)}
.fitrow span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.colwrap{position:relative;display:inline-block}
.colpick{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:1200;min-width:250px;
  max-height:60vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.24);padding:10px 12px}
.colwrap.open .colpick{display:block}
.colpick .h{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);margin:8px 0 5px}
.colpick .h:first-child{margin-top:0}
.colpick label{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0;cursor:pointer}
.colpick input{width:16px;height:16px;accent-color:var(--accent)}
.colpick .foot{display:flex;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.colpick .foot button{flex:1;padding:6px 8px;border:1px solid var(--line);background:var(--paper);
  color:var(--ink2);border-radius:7px;font-size:12.5px;cursor:pointer}

/* UKLAD DWUKOLUMNOWY okna: pola po lewej, zdjecie z boku.
   Dzieki temu karta jest nizsza i miesci sie na ekranie. */
.mbody{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px 20px;align-items:start}
.mbody > .mmeta,
.mbody > .murl,
.mbody > .murlmsg{grid-column:1 / -1}
.mbody > .mgrid{grid-column:1;grid-template-columns:repeat(3,minmax(0,1fr))}
.mbody > .mphoto{grid-column:2;margin-top:0;flex-direction:column;gap:10px;
  position:sticky;top:0}
.mbody > .mphoto .mthumb{width:250px;height:250px}
.mbody > .mphoto .mphoto-ctrl{width:250px}
.mbody > .mphoto .btn{width:100%;text-align:center}
@media (max-width:900px){
  .mbody{grid-template-columns:minmax(0,1fr)}
  .mbody > .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mbody > .mphoto{grid-column:1;position:static}
}

/* zakladka INSTRUKCJE */
.chipset{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip-q{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-weight:600}
.chip-q.w{background:var(--warn-bg);color:var(--warn)}
.chip-q.t{background:var(--panel);color:var(--ink2)}
.chip-off{font-size:12px;color:var(--muted)}
.prio{display:inline-block;min-width:24px;text-align:center;font-weight:800;font-size:12.5px;
  padding:2px 7px;border-radius:7px}
.prio.p1{background:var(--bad-bg);color:var(--bad)}
.prio.p2{background:var(--warn-bg);color:var(--warn)}
.prio.p3{background:var(--panel);color:var(--muted)}
.instr-t{font-weight:600;line-height:1.35}
.instr-b{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.qgrp{display:flex;flex-direction:column;gap:4px}
.qgrp > span{font-size:13px;color:var(--ink2)}
.qbtns{display:flex;gap:6px;flex-wrap:wrap}
.qbtns button{padding:7px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink2);
  border-radius:8px;font-size:13.5px;cursor:pointer}
.qbtns button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
#i_priority button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#instrModal .mbody{display:block}
#instrModal .mgrid{grid-template-columns:1fr 1fr}
</style>
</head>
<body>

<div class="head">
  <h1>Garaż</h1>
  <button class="themebtn" id="themebtn" type="button" aria-label="Tryb dzienny / nocny"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div>
