<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1"><link rel="alternate icon" href="/favicon.ico?v=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/theme.css?v=3">
<script>try{if(localStorage.getItem("qtheme")==="dark")document.documentElement.classList.add("theme-dark")}catch(e){}</script>
<title>Raport wyprawy — generowanie</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#f2ecdd;color:#26332a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  html.theme-dark body{background:#1a1d24;color:#e8e8e8;}
  .card{max-width:520px;text-align:center;padding:34px 30px;background:#fbf7ec;border:1px solid #dcd0ba;
    border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);}
  html.theme-dark .card{background:#222732;border-color:#333;}
  h1{font-size:20px;margin:0 0 6px;}
  p{color:#8c8168;font-size:14px;margin:6px 0;}
  .spin{width:44px;height:44px;margin:18px auto;border:4px solid #dcd0ba;border-top-color:#3c6b47;
    border-radius:50%;animation:r 1s linear infinite;}
  @keyframes r{to{transform:rotate(360deg)}}
  .t{font-variant-numeric:tabular-nums;font-weight:650;}
  .err{color:#a6503d;white-space:pre-wrap;text-align:left;font-size:12px;margin-top:12px;}
  a.btn{display:inline-block;margin-top:14px;padding:9px 16px;background:#3c6b47;color:#fff;
    text-decoration:none;border-radius:8px;font-size:14px;}
</style>
</head>
<body>
<div class="card">
  <h1 id="ttl">Generuję raport wyprawy…</h1>
  <div class="spin" id="spin"></div>
  <p>Składam mapę, wykresy, profile podjazdów i atrakcje dla całej trasy i każdego dnia.</p>
  <p>To trwa zwykle <b>około minuty</b> — nie zamykaj tej karty. <span class="t" id="el">0 s</span></p>
  <div id="out"></div>
</div>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var rid = qs.get("route_id") || "";
  var cuts = qs.get("cuts") || "";
  var name = qs.get("name") || "";
  var date = qs.get("date") || "";
  var t0 = Date.now();
  var elEl = document.getElementById("el");
  setInterval(function(){ elEl.textContent = Math.round((Date.now()-t0)/1000) + " s"; }, 1000);

  function fail(msg){
    document.getElementById("spin").style.display = "none";
    document.getElementById("ttl").textContent = "Nie udało się wygenerować raportu";
    document.getElementById("out").innerHTML = '<div class="err">'+ (msg||"") +'</div>'
      + '<a class="btn" href="javascript:location.reload()">Spróbuj ponownie</a>';
  }
  function done(url){
    document.getElementById("spin").style.display = "none";
    document.getElementById("ttl").textContent = "Gotowe — otwieram PDF";
    location.href = url + (url.indexOf("?") >= 0 ? "&" : "?") + "v=" + Date.now();
  }

  var startUrl = "/api/wyprawa/pdf-start?route_id="+encodeURIComponent(rid)
    + "&cuts="+encodeURIComponent(cuts) + "&date="+encodeURIComponent(date) + "&name="+encodeURIComponent(name);

  fetch(startUrl, {cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
    if(!j || !j.url){ fail("Serwer nie zwrócił adresu pliku."); return; }
    var url = j.url, errUrl = j.err_url;
    var tries = 0, MAX = 150; // ~5 min
    var iv = setInterval(function(){
      tries++;
      if(tries > MAX){ clearInterval(iv); fail("Przekroczono czas generowania."); return; }
      // najpierw sprawdź błąd
      fetch(errUrl, {cache:"no-store"}).then(function(er){
        if(er.ok){ return er.text().then(function(tx){ clearInterval(iv); fail(tx); }); }
        // potem gotowy PDF
        fetch(url, {cache:"no-store", method:"HEAD"}).then(function(pr){
          if(pr.ok){ clearInterval(iv); done(url); }
        }).catch(function(){});
      }).catch(function(){});
    }, 2000);
  }).catch(function(e){ fail(String(e)); });
})();
</script>
</body>
</html>
