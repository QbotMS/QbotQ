<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- trener-fragment.html (2026-10-08): JEDEN dzial prawdziwego Trenera (trener.js) do osadzenia w ramce innej strony.
     ?sub=bilans (Forma > Bilans i waga) | tydzien | czas | cele | dostep | sezon | kalib. Bez menu serwisu i paska zakladek.
     Zapisy dzialaja jak w Treningu. Nie zmienia zapamietanej zakladki (localStorage qtrener_sub). Dok.: docs/TRENER.md -->
<script>try{if(localStorage.getItem("qtheme")==="dark")document.documentElement.classList.add("theme-dark")}catch(e){}</script>
<script src="/qdate.js?v=1"></script>
<link rel="stylesheet" href="/ui2.css?v=10">
<link rel="stylesheet" href="/nav.css?v=8">
<link rel="stylesheet" href="/trener.css?v=3">
<title>Trener (fragment)</title>
<style>
:root{--qnav-rail:0px!important}
html,body{background:transparent!important}
body{padding-left:0!important;margin:0!important}
.wrap{padding:0!important;margin:0!important;max-width:none!important}
.head,.tr-sub,.tabs{display:none!important}
</style>
</head>
<body><div class="wrap">
<div class="head"><h1>Trener</h1></div>
<section class="panel stack" id="p-trener"><div id="trener-root"></div></section>
</div>
<script>
(function(){
  var m=/[?&]sub=([a-z]+)/.exec(location.search),SUB=m?m[1]:"tydzien",old=null;
  try{old=localStorage.getItem("qtrener_sub");}catch(e){}
  /* trener.js po wczytaniu danych wola TRENER_M.ready() zamiast go(zapamietana); trener-m.js celowo NIE jest ladowany */
  window.TRENER_M={ready:function(){
    if(window.TRENER_CORE)window.TRENER_CORE.go(SUB);
    try{if(old===null)localStorage.removeItem("qtrener_sub");else localStorage.setItem("qtrener_sub",old);}catch(e){}
  }};
})();
</script>
<script src="/ui2-common.js?v=3"></script>
<script src="/trener.js?v=34"></script>
</body>
</html>
