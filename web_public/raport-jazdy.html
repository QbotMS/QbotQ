<title>QBot — Raport z jazdy</title>
<style>
html,body{height:100%}
body{overflow:hidden}
#ws{position:fixed;top:0;bottom:0;right:0;left:var(--qnav-rail,56px)}
@media(max-width:820px),(pointer:coarse) and (max-height:500px){#ws{left:0}}
#map{position:absolute;inset:0;background:var(--well)}
.ov{position:absolute;z-index:1000;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 18px rgba(0,0,0,.25)}
html.theme-dark .ov{background:rgba(13,16,22,.86)}
/* panel jazdy */
#pj{top:12px;left:12px;width:320px;padding:12px 14px}
#pj select{width:100%;font:inherit;font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;margin-bottom:8px}
#pj .ttl{font-size:18px;font-weight:600;line-height:1.2}
#pj .dt{font-size:13px;color:var(--ink2);margin-bottom:8px}
.kk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px}
.kk .lbl{font-size:12px}
.kk .v{font-size:19px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kk .s{font-size:11.5px;color:var(--muted)}
#pj .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{appearance:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:var(--r-sm);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{border-color:var(--accent);color:var(--accent-ink)}
#pj .themebtn{width:30px;height:30px;margin-left:auto}
/* legenda sladu */
#tl{top:12px;right:12px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:420px}
#tl .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#tl select{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
/* odcinek */
#sg{top:64px;right:12px;width:300px;padding:12px 14px;display:none}
#an{font-size:14.5px;line-height:1.5}
#an .q{border-top:1px solid var(--line);padding:10px 0}
#an .qh{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#an .qh .rate{text-transform:none;letter-spacing:0}
#an .q p{margin:4px 0;font-size:14.5px}
#an .tw{overflow-x:auto}
#an table.at{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
#an .at td,#an .at th{padding:4px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#an .at th{font-weight:400;color:var(--muted);font-size:12px;border-top:0}
#an .at td:first-child,#an .at th:first-child{text-align:left}
#an .at tr.tx td{border-top:0;text-align:left;color:var(--ink2);font-size:13px;padding-top:0;white-space:normal}
#an .uw{background:var(--well);border-radius:var(--r-sm);padding:8px 10px;margin-top:6px}
#an .uw b{display:block}
#an .uw .zal{color:var(--accent-ink);margin-top:3px;font-weight:600}
#an .small{font-size:12.5px;color:var(--muted);margin-top:4px}
#dane .it.col>:not(.h){display:none}
#dane .colchev{color:var(--muted);font-size:12px}
#an .v{font-size:16px;font-weight:600;margin:6px 0 10px}
#an .hl{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
#an .hl span{background:var(--well);border-radius:var(--r-sm);padding:6px 10px;font-size:14px}
#an .sc{border-top:1px solid var(--line);padding:8px 0}
#an .sc b{display:block;font-size:14.5px}
#an .sc p{margin:3px 0 0;color:var(--ink2);font-size:14px}
#an .kmp{display:inline-block;background:var(--accent-bg);color:var(--accent-ink);border-radius:999px;padding:0 9px;font-size:12px;font-weight:600;cursor:pointer;margin-left:6px;vertical-align:1px}
#an .kmp:hover{background:var(--accent);color:#fff}
#an .nx{background:var(--accent-bg);color:var(--accent-ink);border-radius:var(--r-sm);padding:8px 10px;margin-top:10px;font-size:14px}
#an .nx li{margin:2px 0}
#an .meta{font-size:12.5px;color:var(--muted);margin-bottom:4px}
#sg .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#sg .h b{font-size:16px}
#sg .x{appearance:none;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
#sg .sub{font-size:13px}
#sg .kk{margin-top:8px}
#sg .ai{margin-top:10px;font-size:14px;line-height:1.5;white-space:pre-wrap;max-height:40vh;overflow:auto;background:var(--well);border-radius:var(--r-sm);padding:10px 12px}
/* dok wykresu */
#dock{left:12px;right:12px;bottom:12px;padding:8px 12px 6px;--dh:230px}
#dock .dbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
#dock .dbar .grp{display:flex;gap:4px;align-items:center;margin-right:6px}
#dock .chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:2px 9px;font:inherit;font-size:12.5px;cursor:pointer}
#dock .chip.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-bg)}
#dock .chip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
#dock .chip .cv{margin-left:5px;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
#dock .chip:not(.on) .cv{display:none}
#dock .chip .ax{margin-left:6px;color:var(--muted);font-size:12px;padding:0 2px;border-radius:3px}
#dock .chip .ax.on{color:var(--accent-ink);background:var(--accent-bg)}
#dock .chip:not(.on) .ax{display:none}
#dock select{font:inherit;font-size:12.5px;max-width:190px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
#grip{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:60px;height:12px;border-radius:6px;background:var(--line2);cursor:ns-resize;opacity:.8}
#chart{width:100%;height:var(--dh);display:block;touch-action:none;cursor:crosshair}
.mks{position:relative;height:26px;margin:2px 0 0}
.mk{position:absolute;top:0;transform:translateX(-50%);font-size:12px;line-height:1;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:4px 9px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.mk:hover{border-color:var(--accent);color:var(--accent-ink)}
.momico span{display:flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;background:var(--card);border:2px solid var(--accent);font-size:13px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
#tip{position:absolute;pointer-events:none;display:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;padding:6px 9px;border-radius:7px;white-space:nowrap;z-index:5}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:16px;z-index:900;pointer-events:none}
@media(max-width:820px),(pointer:coarse) and (max-height:500px){
  #pj{left:8px;right:8px;top:8px;width:auto;padding:8px 10px}#pj .kk{grid-template-columns:repeat(3,1fr)}#pj .kk .v{font-size:16px}#pj .kk .s{display:none}
  #tl{display:none}#sg{top:auto;bottom:calc(var(--dh) + 70px);left:8px;right:8px;width:auto}
  #dock{left:8px;right:8px;bottom:8px;--dh:170px}#dock .dbar{font-size:12px}
}


/* widok Analiza (pelna szerokosc nad mapa) */
#dane{position:absolute;inset:0;z-index:950;overflow:auto;background:var(--bg);padding:0;font-size:14.5px;line-height:1.5}
#dhd{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
#dhd #pj{position:static;top:auto;left:auto;right:auto;width:auto;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:10px 18px;background:none;backdrop-filter:none;border:0;border-radius:0;box-shadow:none}
#dhd #pj .id{min-width:230px}
#dhd #pj select{margin-bottom:4px}
#dhd #pj .dt{margin-bottom:0}
#dhd #pj .kk{grid-template-columns:repeat(7,auto);gap:4px 26px;flex:1}
#dhd #pj .kk .v{font-size:20px}
#dhd #pj .row{margin-top:0}
#dhd #pj .themebtn{margin-left:0}
#dgrid{display:flex;flex-direction:column;gap:12px;padding:14px 18px 24px}
#dgrid .dsec .nar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:stretch}
#dgrid .it.wt{grid-column:span 2}
#dgrid .pairrow{grid-column:1/-1;display:flex;gap:8px;align-items:stretch}
#dgrid .pairrow>.it{margin:0}
#dgrid .pairrow>.it:first-child{flex:0 0 220px;max-width:220px}
#dgrid .pairrow>.it:last-child{flex:1 1 0;min-width:0}
#dgrid .it.zonecard{grid-column:1/-1;order:3}
#dgrid .it .h b[title]{cursor:help;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
#dgrid .zonewrap{display:grid;grid-template-columns:1fr 1fr;gap:22px}
#dane .dsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-sizing:border-box}
#dane .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#dane .dh b{font-size:17px}
#dane .dh{cursor:pointer;user-select:none}
#dane .dh .chev{color:var(--muted);font-size:18px;margin-left:10px;line-height:1}
#dane .dsec:not(.open)>.db{display:none}
#dane .dsec:not(.open)>.dh{margin-bottom:0}
#dane .nar{display:flex;flex-direction:column;gap:8px}
#dane .it{background:var(--well);border-radius:var(--r-sm);padding:10px 12px}
#dane .it .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#dane .it .h b{font-size:15px;font-weight:600}
#dane .rate{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--card);color:var(--ink2);white-space:nowrap}
#dane .rate.good{background:var(--good-bg);color:var(--good)}#dane .rate.warn{background:var(--warn-bg);color:var(--warn)}#dane .rate.bad{background:var(--bad-bg);color:var(--bad)}
#dane .num{font-size:24px;font-weight:600;margin:4px 0 2px;font-variant-numeric:tabular-nums}
#dane .num small{font-size:13px;color:var(--ink2);font-weight:400}
#dane .it p{margin:3px 0 0;font-size:14px;color:var(--ink2)}
#dane .kmp{display:inline-block;background:var(--accent-bg);color:var(--accent-ink);border-radius:999px;padding:0 9px;font-size:12px;font-weight:600;cursor:pointer;margin-left:4px;vertical-align:1px}
#dane .kmp:hover{background:var(--accent);color:#fff}
#dane tr.kmp{display:table-row;background:none;color:inherit;font-weight:400;cursor:pointer}
#dane tr.kmp:hover td{background:var(--accent-bg)}
#dane .zone{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 4px}
#dane .lg{font-size:12.5px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap}
#dane .lg i,#dane .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#dane table.tb{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
#dane .tb td{padding:5px 6px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}#dane .tb td:first-child{text-align:left}
#dane .tb th{padding:5px 6px;text-align:right;font-weight:400;font-size:12px;color:var(--muted)}#dane .tb th:first-child{text-align:left}
#dane .hgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:0;font-size:13.5px;margin:6px 0}#dane .hgrid>.hl{padding:4px 6px;border-bottom:1px solid var(--line)}#dane .hgrid>.hr{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}#dane .hgrid>.hl:nth-child(-n+3),#dane .hgrid>.hr:nth-child(-n+3){border-bottom:none;font-size:12px;color:var(--muted);padding-bottom:6px}
#dane .tb tr.h td{border:0;color:var(--muted);font-size:12px}
/* 2026-10-06: tr.h w karcie lapal '#dane .it .h' (flex) -> naglowki rozjechane wzgledem kolumn */
#dane .it table tr.h{display:table-row}
/* 2026-10-06: Rower i naped - lewa polowa: rower na gorze + male kafelki w rzedzie; prawa: biegi */
#dgrid .rnl{grid-column:span 3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start}
#dgrid .rnl.rnl-full{grid-column:1/-1;grid-template-columns:repeat(6,minmax(0,1fr))}
#dgrid .rnl>.it{grid-column:auto;margin:0}
#dgrid .rnl-top{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
#dgrid .rnl-top .tb td{padding-top:3px;padding-bottom:3px}
@media(max-width:820px),(pointer:coarse) and (max-height:500px){#dgrid .rnl,#dgrid .rnl.rnl-full{grid-column:auto!important;grid-template-columns:minmax(0,1fr)!important}}
#dane .tb tr.h td{white-space:nowrap;vertical-align:bottom;padding-bottom:4px;border-bottom:1px solid var(--line)}
#dane .mmp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
#dane .mmp div{background:var(--card);border-radius:8px;padding:6px 4px;text-align:center}
#dane .mmp .l{font-size:12px;color:var(--ink2)}#dane .mmp .v{font-size:16px;font-weight:600}#dane .mmp .r{font-size:12px;color:var(--accent-ink)}
@media(max-width:820px),(pointer:coarse) and (max-height:500px){#dgrid .pairrow{flex-direction:column}#dgrid .it.wt{grid-column:auto}#dhd #pj{gap:10px;padding:8px 10px}#dhd #pj .kk{grid-template-columns:repeat(3,1fr);gap:4px 10px}#dhd #pj .kk .v{font-size:16px}}
/* === MOBILE v1 raport jazdy (2026-09-29): uklad na telefon ===
   gora: wybor jazdy + liczby + Przebieg/Analiza (obok przycisku menu)
   dol: panel wykresu na cala szerokosc, przelaczniki w jednym przewijanym rzedzie,
   momenty jako przewijana lista zamiast nakladajacych sie dymkow; uchwyt = zmiana wysokosci */
@media(max-width:820px),(pointer:coarse) and (max-height:500px){
  .leaflet-control-zoom{display:none}
  #pj{top:calc(8px + env(safe-area-inset-top,0px));left:62px;right:8px;padding:6px 8px}
  #pj select{margin-bottom:6px;min-height:40px}
  #pj #h-title,#pj #h-date,#pj #bwbtn,#pj .themebtn,#pj .qbrand{display:none}
  #pj .kk{gap:2px 8px}
  #pj .kk .lbl{font-size:11.5px}
  #pj .kk .v{font-size:15px}
  #pj .row{margin-top:6px}
  #pj .row .btn,#pj .seg button{min-height:40px;font-size:14px}
  #dhd #pj{padding-left:62px}
  #dock{left:0;right:0;bottom:0;border-radius:14px 14px 0 0;border-bottom:0;padding:12px 8px calc(6px + env(safe-area-inset-bottom,0px));--dh:160px}
  #grip{top:-4px;width:90px;height:26px;background:transparent;opacity:1;touch-action:none}
  #grip::after{content:"";position:absolute;left:50%;top:8px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--line2)}
  #dock .dbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -8px 4px;padding:0 8px 4px}
  #dock .dbar::-webkit-scrollbar{display:none}
  #dock .dbar .grp{flex:0 0 auto}
  #dock .chip{flex:0 0 auto;min-height:36px;padding:4px 12px;font-size:13px;white-space:nowrap}
  #dock select{min-height:36px;font-size:16px;flex:0 0 auto}
  #hint{display:none}
  .mks{height:auto;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:2px -8px 4px;padding:0 8px}
  .mks::-webkit-scrollbar{display:none}
  .mk{position:static;transform:none;flex:0 0 auto;font-size:13px;padding:9px 12px}
  #sg{bottom:calc(var(--dh) + 130px);max-height:45vh;overflow:auto}
  #sg .x{min-width:44px;min-height:44px}
  #dhd{position:static}
  #dane .kmp,#an .kmp{font-size:13px;padding:4px 10px}
  #dane button,#dane .btn{min-height:40px}
  #dgrid{padding:10px 8px 24px}
  #dgrid .dsec .nar{grid-template-columns:minmax(0,1fr)!important}
  #dgrid .it,#dgrid .it.wt,#dgrid .it.zonecard{grid-column:auto!important;min-width:0}
  #dgrid .zonewrap{grid-template-columns:minmax(0,1fr)}
  #dgrid .pairrow>.it:first-child{flex:1 1 auto;max-width:none}
  #dane .dsec{padding:10px}
  #dane table,#an table.at{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #dane svg{max-width:100%;height:auto}
}
</style>

  <div class="ov" id="sg">
