<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<script>try{if(localStorage.getItem("qtheme")==="dark")document.documentElement.classList.add("theme-dark")}catch(e){}</script>
<link rel="stylesheet" href="/ui2.css?v=11">
<link rel="stylesheet" href="/nav.css?v=14">
<title>QBot — SpO2 nocne (test)</title>
<!-- SpO2 nocne (2026-10-20, sesja spo2-2010) - STRONA TESTOWA obok Zdrowie > Serce.
     Dane: /api/jedzenie/spo2 (qbot_food_api.py -> qbot_spo2.py). Dok.: docs/SPO2.md -->
<style>
.tst{font-size:12.5px;color:var(--muted);margin:-4px 0 14px}
.verd{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.verd .big{font-size:30px;font-weight:600;line-height:1.1}
.verd .sub{font-size:14px;color:var(--ink2);margin-top:4px;font-variant-numeric:tabular-nums}
.lv-good{color:var(--good)}.lv-warn{color:var(--warn)}.lv-bad{color:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:1px}
.facts{margin:12px 0 0;padding:0;list-style:none;font-size:14px}
.facts li{padding:5px 0;border-top:1px solid var(--line)}
.facts li:first-child{border-top:0}
details.how summary{cursor:pointer;color:var(--accent-ink);font-size:12.5px;margin-top:10px}
details.how p{font-size:12.5px;color:var(--ink2);line-height:1.5;margin:6px 0 0}
.rng{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.rng .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.rng .btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.rng input{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--well);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:12px;height:4px;border-radius:2px;display:inline-block}
.chip.on{color:var(--ink);background:var(--well);border-color:var(--line2)}
.chip:not(.on) i{filter:grayscale(1);opacity:.5}
.chw{position:relative;height:260px}
.chw.tall{height:300px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.nh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.nh h2{margin:0}
.nstats{font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-bottom:8px}
.zr{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.empty{color:var(--muted);font-size:14px}
.stack>.card+.card{margin-top:12px}
</style>
</head>
<body><div class="wrap">
<div class="head"><h1>SpO2 nocne</h1></div>
<p class="tst">Strona testowa — docelowo kafel w Zdrowie › Serce. Prawdziwa strona Zdrowia jest nietknięta.</p>
<div class="stack">
  <div class="card" id="c-verd"><p class="empty">Wczytuję…</p></div>
  <div class="card">
    <h2>Noce — minuty spadków</h2>
    <div class="rng" id="rng">
      <button class="btn" data-d="30">30 dni</button><button class="btn on" data-d="90">90 dni</button><button class="btn" data-d="0">Całość</button>
      <span style="margin-left:6px;font-size:12.5px;color:var(--muted)">od</span><input type="date" id="r-a"><span style="font-size:12.5px;color:var(--muted)">do</span><input type="date" id="r-b">
    </div>
    <div class="chips" id="chips1"></div>
    <div class="chw"><canvas id="ch1"></canvas></div>
    <div class="hint">Kliknij słupek, żeby zobaczyć noc minuta po minucie. Przeciągnij po wykresie, żeby powiększyć; dwuklik — całość.</div>
  </div>
  <div class="card" id="c-night"><p class="empty">Wczytuję noc…</p></div>
</div>
</div>
<script src="/nav.js?v=18"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function () {
  "use strict";
  var API = "/api/jedzenie/spo2";
  var LBL = {good: "spokojna", warn: "do obserwacji", bad: "niespokojna"};
  var ALL = [], VIEW = [], CH1 = null, CH2 = null, SEL = null, NIGHT = null;
  var VIS1 = {drop: true, norm: true, alc: true};
  var VIS2 = {spo2: true, thr: true, p90: true};

  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#888"; }
  function stc(s) { return s === "bad" ? css("--bad") : s === "warn" ? css("--warn") : s === "good" ? css("--good") : css("--line2"); }
  function ddmm(iso) { return iso.slice(8, 10) + "." + iso.slice(5, 7); }
  function ddmmyy(iso) { return ddmm(iso) + "." + iso.slice(0, 4); }
  function pl(x) { return String(x).replace(".", ","); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
  function get(u) { return fetch(u, {credentials: "same-origin"}).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }); }

  /* ---------- kafel wniosku ---------- */
  function renderVerdict(v, f) {
    var el = document.getElementById("c-verd");
    if (!v || !v.status) { el.innerHTML = '<p class="empty">' + esc((v && v.text) || "Brak danych") + "</p>"; return; }
    var L = v.last;
    var h = '<div class="verd"><div><div style="font-size:13px;color:var(--muted)">Ostatnia noc · ' + ddmm(L.day) + " (" + L.start + "–" + L.end + ")</div>" +
      '<div class="big lv-' + v.status + '"><span class="dot" style="background:' + stc(v.status) + '"></span>' + esc(v.label[0].toUpperCase() + v.label.slice(1)) + "</div>" +
      '<div class="sub">' + L.drop_min + " min spadków (zwykle ~" + Math.round(L.norm) + ") · " + L.events + " spadków · najniżej " + L.min + "% · średnio " + pl(L.avg) + "%</div></div></div>";
    var items = [];
    if (v.trend_text) items.push('<li class="lv-' + v.trend_level + '">' + esc(v.trend_text) + "</li>");
    (f || []).forEach(function (x) { items.push('<li class="lv-' + x.level + '">' + esc(x.text) + "</li>"); });
    if (items.length) h += '<ul class="facts">' + items.join("") + "</ul>";
    h += '<details class="how"><summary>Jak to liczę?</summary><p>Zegarek mierzy SpO2 co minutę w czasie snu. Dla każdej nocy biorę jej własny typowy poziom (medianę) i liczę minuty, w których saturacja spadła o 4 punkty lub więcej poniżej niego. ' +
      "Noc porównuję z Twoimi 60 poprzednimi nocami: do 75% najgorszych wyników — spokojna, do 90% — do obserwacji, powyżej — niespokojna. " +
      "Pojedyncze spadki są normalne (ruch, pozycja ciała). Odczyty minutowe są od 01.06.2026 — starszych Garmin już nie oddaje.</p></details>";
    el.innerHTML = h;
  }

  /* ---------- wykres nocy (słupki) ---------- */
  function chips(id, defs, vis, redraw) {
    var c = document.getElementById(id);
    c.innerHTML = defs.map(function (d) { return '<button class="chip' + (vis[d.k] ? " on" : "") + '" data-k="' + d.k + '"><i style="background:' + d.col + '"></i>' + d.t + "</button>"; }).join("");
    c.onclick = function (e) { var b = e.target.closest(".chip"); if (!b) return; vis[b.dataset.k] = !vis[b.dataset.k]; b.classList.toggle("on"); redraw(); };
  }

  function dragZoom(cv, getCh, onZoom) {
    var d0 = null;
    cv.addEventListener("mousedown", function (e) { d0 = {x0: e.clientX}; });
    cv.addEventListener("mouseup", function (e) {
      var ch = getCh(); if (!d0 || !ch) return;
      var r = cv.getBoundingClientRect(), xs = ch.scales.x;
      var a = xs.getValueForPixel(Math.min(d0.x0, e.clientX) - r.left), b = xs.getValueForPixel(Math.max(d0.x0, e.clientX) - r.left);
      if (Math.abs(e.clientX - d0.x0) > 8 && b - a >= 2) onZoom(Math.round(a), Math.round(b));
      d0 = null;
    });
    cv.addEventListener("dblclick", function () { onZoom(null, null); });
  }

  function drawNights() {
    var ctx = document.getElementById("ch1");
    var lab = VIEW.map(function (n) { return ddmm(n.day); });
    var ds = [];
    if (VIS1.drop) ds.push({type: "bar", label: "Minuty spadków", data: VIEW.map(function (n) { return n.drop_min; }),
      backgroundColor: VIEW.map(function (n) { return stc(n.status); }),
      borderColor: VIEW.map(function (n) { return SEL === n.day ? css("--ink") : "transparent"; }), borderWidth: 2, order: 2});
    if (VIS1.norm) ds.push({type: "line", label: "Twoja norma", data: VIEW.map(function (n) { return n.norm; }), borderColor: css("--ink2"),
      borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, tension: .2, order: 1});
    if (VIS1.alc) ds.push({type: "line", label: "Alkohol dzień wcześniej", data: VIEW.map(function (n) { return n.alcohol ? -2 : null; }),
      showLine: false, pointStyle: "triangle", pointRadius: 6, pointBackgroundColor: css("--accent"), borderColor: css("--accent"), order: 0});
    if (CH1) CH1.destroy();
    CH1 = new Chart(ctx, {data: {labels: lab, datasets: ds}, options: {
      responsive: true, maintainAspectRatio: false, animation: false, interaction: {mode: "index", intersect: false},
      plugins: {legend: {display: false}, tooltip: {callbacks: {
        title: function (it) { var n = VIEW[it[0].dataIndex]; return ddmmyy(n.day) + " · " + (LBL[n.status] || "bez oceny"); },
        label: function () { return null; },
        afterBody: function (it) { var n = VIEW[it[0].dataIndex]; var a = [
          n.drop_min + " min spadków (norma ~" + (n.norm == null ? "–" : Math.round(n.norm)) + ")",
          n.events + " spadków, najniżej " + n.min + "%, średnio " + pl(n.avg) + "%",
          "pomiar " + n.start + "–" + n.end + (n.below90 ? ", poniżej 90%: " + n.below90 + " min" : "")];
          if (n.alcohol) a.push("🍷 alkohol dzień wcześniej");
          if (n.tss_prev) a.push("jazda dzień wcześniej: TSS " + n.tss_prev);
          if (n.hrv) a.push("HRV rano " + Math.round(n.hrv) + " ms" + (n.score ? ", ocena snu " + n.score : ""));
          return a; }}}},
      scales: {x: {grid: {display: false}, ticks: {color: css("--muted"), maxRotation: 0, autoSkip: true, maxTicksLimit: 12}},
        y: {min: -4, grid: {color: css("--line")}, ticks: {color: css("--muted"), callback: function (v) { return v < 0 ? "" : v; }}, title: {display: true, text: "min", color: css("--muted")}}},
      onClick: function (e, els) { if (els && els.length) loadNight(VIEW[els[0].index].day); }
    }});
  }

  function setRange(days, a, b) {
    var last = ALL.length ? ALL[ALL.length - 1].day : null;
    if (a || b) VIEW = ALL.filter(function (n) { return (!a || n.day >= a) && (!b || n.day <= b); });
    else if (!days) VIEW = ALL.slice();
    else { var cut = new Date(Date.parse(last) - days * 864e5).toISOString().slice(0, 10); VIEW = ALL.filter(function (n) { return n.day > cut; }); }
    drawNights();
  }

  document.getElementById("rng").addEventListener("click", function (e) {
    var b = e.target.closest(".btn"); if (!b) return;
    document.querySelectorAll("#rng .btn").forEach(function (x) { x.classList.toggle("on", x === b); });
    document.getElementById("r-a").value = document.getElementById("r-b").value = "";
    setRange(+b.dataset.d);
  });
  ["r-a", "r-b"].forEach(function (id) { document.getElementById(id).addEventListener("change", function () {
    document.querySelectorAll("#rng .btn").forEach(function (x) { x.classList.remove("on"); });
    setRange(0, document.getElementById("r-a").value, document.getElementById("r-b").value); }); });

  /* ---------- noc minuta po minucie ---------- */
  var Z2 = null;
  function drawNight() {
    var d = NIGHT, el = document.getElementById("c-night");
    if (!d) return;
    var n = ALL.find(function (x) { return x.day === d.day; }) || {};
    if (!el.dataset.built) {
      el.innerHTML = '<div class="nh"><h2 id="n-t"></h2><button class="zr" id="n-zr" hidden>Pokaż całą noc</button></div><div class="nstats" id="n-s"></div>' +
        '<div class="chips" id="chips2"></div><div class="chw tall"><canvas id="ch2"></canvas></div><div class="hint">Na czerwono — minuty spadku (≥ 4 pkt poniżej typowego poziomu nocy). Przeciągnij, żeby powiększyć; dwuklik — całość.</div>';
      el.dataset.built = "1";
      chips("chips2", [{k: "spo2", t: "SpO2", col: css("--accent")}, {k: "thr", t: "Próg spadku", col: css("--bad")}, {k: "p90", t: "90%", col: css("--muted")}], VIS2, drawNight);
      dragZoom(document.getElementById("ch2"), function () { return CH2; }, function (a, b) { Z2 = a == null ? null : {min: a, max: b}; drawNight(); });
      document.getElementById("n-zr").onclick = function () { Z2 = null; drawNight(); };
    }
    document.getElementById("n-t").innerHTML = "Noc " + ddmmyy(d.day) + (n.status ? ' · <span class="lv-' + n.status + '">' + LBL[n.status] + "</span>" : "");
    document.getElementById("n-s").textContent = d.start + "–" + d.end + " · " + d.n + " odczytów · typowo " + d.med + "% · najniżej " + d.min + "% · " +
      d.events + " spadków, " + d.drop_min + " min" + (d.below90 ? " · poniżej 90%: " + d.below90 + " min" : "");
    document.getElementById("n-zr").hidden = !Z2;
    var lab = d.series.map(function (p) { return p[0]; }), val = d.series.map(function (p) { return p[1]; });
    var bad = css("--bad"), acc = css("--accent");
    var ds = [];
    if (VIS2.spo2) ds.push({label: "SpO2", data: val, borderColor: acc, borderWidth: 1.6, pointRadius: 0, tension: .15,
      segment: {borderColor: function (c) { return (val[c.p0DataIndex] <= d.thr || val[c.p1DataIndex] <= d.thr) ? bad : acc; }}});
    if (VIS2.thr) ds.push({label: "Próg spadku", data: val.map(function () { return d.thr; }), borderColor: bad, borderDash: [5, 4], borderWidth: 1, pointRadius: 0});
    if (VIS2.p90) ds.push({label: "90%", data: val.map(function () { return 90; }), borderColor: css("--muted"), borderDash: [2, 4], borderWidth: 1, pointRadius: 0});
    if (CH2) CH2.destroy();
    var lo = Math.min(88, d.min - 1);
    CH2 = new Chart(document.getElementById("ch2"), {type: "line", data: {labels: lab, datasets: ds}, options: {
      responsive: true, maintainAspectRatio: false, animation: false, interaction: {mode: "index", intersect: false},
      plugins: {legend: {display: false}, tooltip: {callbacks: {
        title: function (it) { return it[0].label; },
        label: function (c) { return c.dataset.label === "SpO2" ? "SpO2 " + c.parsed.y + "%" + (c.parsed.y <= d.thr ? " — spadek" : "") : null; }}}},
      scales: {x: {min: Z2 ? Z2.min : undefined, max: Z2 ? Z2.max : undefined, grid: {display: false}, ticks: {color: css("--muted"), maxRotation: 0, autoSkip: true, maxTicksLimit: 10}},
        y: {min: lo, max: 100, grid: {color: css("--line")}, ticks: {color: css("--muted"), callback: function (v) { return v + "%"; }}}}
    }});
  }

  function loadNight(day) {
    SEL = day; Z2 = null; drawNights();
    get(API + "?day=" + day).then(function (d) { NIGHT = d; drawNight(); })
      .catch(function (e) { document.getElementById("c-night").innerHTML = '<p class="empty">Nie udało się wczytać nocy (' + esc(e.message) + ").</p>"; });
  }

  get(API + "?days=400").then(function (s) {
    ALL = s.nights || [];
    renderVerdict(s.verdict, s.factors);
    chips("chips1", [{k: "drop", t: "Minuty spadków", col: css("--good")}, {k: "norm", t: "Twoja norma", col: css("--ink2")}, {k: "alc", t: "Alkohol dzień wcześniej", col: css("--accent")}], VIS1, drawNights);
    dragZoom(document.getElementById("ch1"), function () { return CH1; }, function (a, b) {
      if (a == null) { setRange(+(document.querySelector("#rng .btn.on") || {dataset: {d: 90}}).dataset.d); return; }
      VIEW = VIEW.slice(a, b + 1); drawNights(); });
    setRange(90);
    if (ALL.length) loadNight(ALL[ALL.length - 1].day);
  }).catch(function (e) { document.getElementById("c-verd").innerHTML = '<p class="empty">Błąd wczytywania: ' + esc(e.message) + "</p>"; });
})();
</script>
</body>
</html>
