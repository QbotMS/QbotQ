<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Średnia moc, moc znormalizowana i próg z jazdy 18.10.2026</title>
  <desc id="desc">Trzy poziome słupki: średnia moc 154 W, moc znormalizowana 174,505 W i próg ModelQ 240,7 W.</desc>
  <rect width="760" height="300" rx="18" fill="#101923"/>
  <text x="32" y="42" fill="#f1f5f9" font-family="sans-serif" font-size="20" font-weight="700">Jazda 18.10.2026 · Marki</text>
  <text x="32" y="67" fill="#9fb0c0" font-family="sans-serif" font-size="13">Moc w watach · wartości z bazy, przed zaokrągleniem</text>
  <g font-family="sans-serif" font-size="14" fill="#dbe5ee">
    <text x="32" y="116">Średnia moc</text>
    <text x="32" y="176">NP</text>
    <text x="32" y="236">Próg TP</text>
  </g>
  <g fill="#263544">
    <rect x="180" y="94" width="500" height="28" rx="8"/>
    <rect x="180" y="154" width="500" height="28" rx="8"/>
    <rect x="180" y="214" width="500" height="28" rx="8"/>
  </g>
  <rect x="180" y="94" width="320" height="28" rx="8" fill="#55a8ed"/>
  <rect x="180" y="154" width="362" height="28" rx="8" fill="#ffad42"/>
  <rect x="180" y="214" width="500" height="28" rx="8" fill="#ff6b35"/>
  <g font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">
    <text x="510" y="113">154 W</text>
    <text x="552" y="173">174,505 W</text>
    <text x="668" y="233" text-anchor="end">240,700 W</text>
  </g>
  <text x="32" y="280" fill="#97a7b7" font-family="sans-serif" font-size="12">IF = 174,505 ÷ 240,700 = 0,72499 → 0,72</text>
</svg>
