<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Progi zmiany prognozy dla zaproszonego gościa</title>
  <desc id="desc">Schemat progów zapisanych w kodzie: temperatura odczuwalna plus minus 3 stopnie, wiatr plus minus 3 metry na sekundę, deszcz 40 procent lub zmiana 30 punktów procentowych, suma opadu 3 milimetry, burza pojawia się lub znika, WBGT przekracza 23 albo 26 stopni.</desc>
  <rect width="900" height="440" rx="20" fill="#f7f1e3"/>
  <text x="32" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#26332a">Kiedy nowa prognoza może wysłać aktualizację</text>
  <text x="32" y="68" font-family="sans-serif" font-size="14" fill="#625c50">Progi porównania zapisane w kodzie automatu</text>
  <g font-family="sans-serif" font-size="15" fill="#26332a">
    <text x="32" y="119">Temperatura odczuwalna</text>
    <text x="32" y="174">Wiatr</text>
    <text x="32" y="229">Szansa deszczu</text>
    <text x="32" y="284">Suma deszczu</text>
    <text x="32" y="339">Burza</text>
    <text x="32" y="394">WBGT</text>
  </g>
  <g stroke="#c9bea8" stroke-width="2">
    <line x1="245" y1="114" x2="842" y2="114"/><line x1="245" y1="169" x2="842" y2="169"/>
    <line x1="245" y1="224" x2="842" y2="224"/><line x1="245" y1="279" x2="842" y2="279"/>
    <line x1="245" y1="334" x2="842" y2="334"/><line x1="245" y1="389" x2="842" y2="389"/>
  </g>
  <g fill="#2f5d3a" font-family="sans-serif" font-size="14" font-weight="700">
    <rect x="465" y="96" width="130" height="34" rx="8" fill="#dce9d8"/><text x="482" y="118">zmiana ±3°C</text>
    <rect x="465" y="151" width="130" height="34" rx="8" fill="#dce9d8"/><text x="480" y="173">zmiana ±3 m/s</text>
    <rect x="465" y="206" width="350" height="34" rx="8" fill="#f2dfbd"/><text x="482" y="228">przekroczenie 40% lub zmiana ≥30 p.p.</text>
    <rect x="465" y="261" width="150" height="34" rx="8" fill="#f2dfbd"/><text x="482" y="283">zmiana ≥3 mm</text>
    <rect x="465" y="316" width="220" height="34" rx="8" fill="#f2dfbd"/><text x="482" y="338">pojawienie się albo zanik</text>
    <rect x="465" y="371" width="250" height="34" rx="8" fill="#f2dfbd"/><text x="482" y="393">przekroczenie 23°C lub 26°C</text>
  </g>
  <text x="32" y="426" font-family="sans-serif" font-size="12" fill="#625c50">Schemat progów, nie zapis rzeczywistej prognozy ani wysłanej wiadomości.</text>
</svg>
