<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Sprawdzalność radaru, 18 października 2026, wyprzedzenie 30 minut</title>
  <desc id="desc">W 960 przypadkach zapisano 0 trafień, 0 fałszywych alarmów, 2 przeoczenia i 958 poprawnych wskazań braku opadu.</desc>
  <rect width="760" height="260" rx="18" fill="#fbf8f0"/>
  <text x="28" y="38" font-family="sans-serif" font-size="18" font-weight="700" fill="#263238">Radar: zapis z 18.10.2026, prognoza +30 min</text>
  <text x="28" y="66" font-family="sans-serif" font-size="13" fill="#5f6b70">960 ocenionych przypadków · jeden moment, nie ocena całego sezonu</text>
  <text x="28" y="111" font-family="sans-serif" font-size="14" fill="#263238">Poprawnie: brak opadu</text>
  <rect x="210" y="91" width="490" height="28" rx="6" fill="#5e9bc7"/>
  <text x="683" y="111" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff">958</text>
  <text x="28" y="157" font-family="sans-serif" font-size="14" fill="#263238">Przeoczony opad</text>
  <rect x="210" y="137" width="4" height="28" rx="2" fill="#d35d4f"/>
  <text x="226" y="157" font-family="sans-serif" font-size="14" font-weight="700" fill="#9e342b">2</text>
  <text x="28" y="203" font-family="sans-serif" font-size="14" fill="#263238">Trafienia / fałszywe alarmy</text>
  <text x="210" y="203" font-family="sans-serif" font-size="14" font-weight="700" fill="#5f6b70">0 / 0</text>
  <text x="28" y="238" font-family="sans-serif" font-size="12" fill="#68777c">Liczby pochodzą z bazy QBot. Długość paska jest proporcjonalna do liczby przypadków.</text>
</svg>
