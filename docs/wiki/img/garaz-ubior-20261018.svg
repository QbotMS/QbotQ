  <text x="715" y="168" fill="#d8e8f8" font-family="sans-serif" font-size="14">6,9°C</text>
  <text x="137" y="242" fill="#c6ced8" font-family="sans-serif" font-size="14">09:30</text>
  <text x="710" y="242" fill="#c6ced8" font-family="sans-serif" font-size="14">12:22</text>
