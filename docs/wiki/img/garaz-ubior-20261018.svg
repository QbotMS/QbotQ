  <text x="28" y="61" fill="#aeb8c4" font-family="sans-serif" font-size="14">Prognoza dla jazdy 09:30–12:22, nie pomiar po jeździe</text>
  <line x1="105" y1="218" x2="760" y2="218" stroke="#596473" stroke-width="1"/>
  <line x1="105" y1="176" x2="760" y2="176" stroke="#83a65c" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="105" y1="151" x2="760" y2="151" stroke="#e8752a" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="28" y="181" fill="#a8c88b" font-family="sans-serif" font-size="13">8°C · pełna długość</text>
  <text x="28" y="156" fill="#f5a06a" font-family="sans-serif" font-size="13">10°C · kurtka</text>
  <polyline points="160,199 360,194 560,186 740,178" fill="none" stroke="#65a9e8" stroke-width="4"/>
  <circle cx="160" cy="199" r="6" fill="#65a9e8"/>
  <circle cx="740" cy="178" r="6" fill="#65a9e8"/>
