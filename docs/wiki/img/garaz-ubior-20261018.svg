<svg xmlns="http://www.w3.org/2000/svg" width="820" height="275" viewBox="0 0 820 275" role="img" aria-labelledby="title desc">
  <title id="title">Temperatura do ubior z prognozy na 18 października 2026</title>
  <desc id="desc">Od 09:30 do 12:22 temperatura do ubioru rośnie od 5,2 do 6,9 stopnia Celsjusza. Chłodny wariant wynosi około 2,5 stopnia. Kod wymaga pełnej długości dołu poniżej 8 stopni i kurtki z rękawami poniżej 10 stopni.</desc>
  <rect width="820" height="275" rx="14" fill="#171b21"/>
