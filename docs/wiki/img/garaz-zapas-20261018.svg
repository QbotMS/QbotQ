<svg xmlns="http://www.w3.org/2000/svg" width="820" height="225" viewBox="0 0 820 225" role="img" aria-labelledby="title desc">
  <title id="title">Konfiguracja przypomnień o zapasie w zakupach 18 października 2026</title>
  <desc id="desc">Dwie aktywne pozycje zakupowe. Zero ma zapisane dane opakowania, więc zero ma prognozę końca zapasu.</desc>
  <rect width="820" height="225" rx="14" fill="#171b21"/>
  <text x="28" y="39" fill="#f4f6f8" font-family="sans-serif" font-size="20" font-weight="700">Zapas w zakupach · 18.10.2026</text>
  <text x="28" y="69" fill="#aeb8c4" font-family="sans-serif" font-size="14">Aktywne pozycje z odczytu listy</text>
  <text x="30" y="117" fill="#f4f6f8" font-family="sans-serif" font-size="15">Pozycje aktywne</text>
  <rect x="230" y="94" width="260" height="30" rx="6" fill="#6389b4"/>
  <text x="510" y="115" fill="#f4f6f8" font-family="sans-serif" font-size="15" font-weight="700">2</text>
  <text x="30" y="162" fill="#f4f6f8" font-family="sans-serif" font-size="15">Z ustawionym opakowaniem</text>
  <rect x="230" y="139" width="8" height="30" rx="4" fill="#e8752a"/>
  <text x="255" y="160" fill="#f4f6f8" font-family="sans-serif" font-size="15" font-weight="700">0</text>
  <text x="30" y="204" fill="#c6ced8" font-family="sans-serif" font-size="14">Bieżących prognoz końca zapasu: 0</text>
</svg>
