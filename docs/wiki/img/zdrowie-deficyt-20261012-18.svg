  <text x="28" y="374" fill="#d5dce5" font-family="sans-serif" font-size="13">Po 6 zamkniętych dniach: plan −2124 kcal, wykonanie −2818 kcal. Tydzień: plan −3024; do niedzieli pozostało −206.</text>
