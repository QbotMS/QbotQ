    <rect x="126" y="180" width="30" height="140" rx="4"/><rect x="236" y="209" width="30" height="111" rx="4"/>
    <rect x="346" y="216" width="30" height="104" rx="4"/><rect x="456" y="251" width="30" height="69" rx="4"/>
    <rect x="566" y="147" width="30" height="173" rx="4"/><rect x="676" y="237" width="30" height="83" rx="4"/>
