    <rect x="311" y="209" width="30" height="111" rx="4"/><rect x="421" y="248" width="30" height="72" rx="4"/>
    <rect x="531" y="209" width="30" height="111" rx="4"/><rect x="641" y="248" width="30" height="72" rx="4"/>
    <rect x="751" y="104" width="30" height="216" rx="4"/>
  </g>
