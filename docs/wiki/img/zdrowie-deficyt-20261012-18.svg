  <rect x="700" y="18" width="18" height="12" rx="3" fill="#b5d489"/><text x="725" y="29" fill="#d9e0e8" font-family="sans-serif" font-size="13">wykonanie (kcal)</text>
  <line x1="65" y1="320" x2="845" y2="320" stroke="#55606e" stroke-width="1"/>
