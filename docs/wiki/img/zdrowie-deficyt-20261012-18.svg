<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Planowany i wykonany deficyt od 12 do 17 października 2026</title>
  <desc id="desc">Sześć par słupków pokazuje plan i wykonanie w kilokaloriach. Wykonanie sumuje się do 2818 kilokalorii, plan do 2124 za te sześć dni. Niedzielny plan to 900 kilokalorii, z czego do godziny zrzutu pozostało 206.</desc>
